# Example profile that runs only the factory's /assess route and its review page ($DSH_HOME/profiles/factory/cordis.patch.yml).
# The owner's software factory posts a permission request to http://127.0.0.1:3083/assess and gets a decision back.
# Replace the four <placeholders> before first start.
- id: webserver
  config:
    host: 127.0.0.1
    # 3083 keeps this profile clear of a `web` profile on DSH's default port, 3080.
    port: 3083
# The prototype's own plugins stay off in this profile: no GitHub or Feishu polling, no management panel.
- id: dsh-superagent
  disabled: true
- id: dsh-superagent-github
  disabled: true
- id: dsh-superagent-feishu
  disabled: true
# The agent preset the route's judge Sessions are created with. A judge reads a project and changes nothing.
- id: dsh-superagent-judge-preset
  disabled: false
# The "Review" link at the foot of DSH's sidebar, to the review page below. It is the package packages/review-link, linked into
# the profile next to dsh-superagent (dsh plugin --profile <name> add "link:<fork>/packages/review-link"), since DSH shows a
# plugin's browser part only for an enabled row named by its package, and this profile turns dsh-superagent's own row off.
- id: dsh-superagent-review-link
  disabled: false
- id: dsh-superagent-factory
  disabled: false
  config:
    # Projects the route may write a decision into. Each must already have its .factory folder, which the factory creates.
    # tokenFile is left out on purpose: it defaults to ~/.config/zees-factory/superagent-token, the file the factory's setup
    # writes (mode 0600). The factory sends that token with each request; the route answers nobody without it.
    # Until that setup (the factory's story 7) writes it, make one by hand: mkdir -p -m 700 ~/.config/zees-factory && (umask 077; openssl rand -hex 32 > ~/.config/zees-factory/superagent-token)
    # The factory's built mask file. Every decision is masked with it before it is written, so no secret and nothing that says
    # who the owner is reaches decisions.jsonl. There is no default: without it the route answers 503 and writes nothing.
    # The file is loaded once: after the factory rebuilds it, restart DSH so the new one is used.
    # The factory's setup (its story 7) will write this line; until then, set it by hand.
    maskModule: <absolute path of lib/dist/decisionMask.js in the factory's folder, for example /home/me/projects/zees-software-factory/lib/dist/decisionMask.js>
    # The factory's built judge guard file. Every tool call of a judge Session is checked with it: only read, grep, glob and
    # read-only shell commands run, and no secret file is read. There is no default: without it no judge Session is opened and
    # the route answers 503 and writes nothing. Like the mask file it is loaded once: restart DSH after the factory rebuilds it.
    guardModule: <absolute path of lib/dist/judgeGuard.js in the factory's folder, for example /home/me/projects/zees-software-factory/lib/dist/judgeGuard.js>
    # The factory's built job log file. Every job log line (actions.jsonl) and every comment the owner writes on the review page
    # (reviews.jsonl) is masked with it before it is written, and the review page at http://127.0.0.1:3083/review reads both files
    # with it. There is no default: without it nothing is written to either file and the review page answers 503. Like the mask
    # file it is loaded once: restart DSH after the factory rebuilds it.
    # One run of DSH on this profile is one job: start it in the folder of a project listed below (one that has its .factory
    # folder). Its job_start line is added to that project's actions.jsonl when something first happens (you write in a session,
    # or a request is answered) or when DSH stops, then one line for each answer and each message into or out of the session you
    # write in first, and job_stop when DSH stops. Started anywhere else, DSH logs one warning and records only the answers.
    # Every session, judges included, starts with the current version of the owner's decision guideline (guideline/v<N>.md in
    # the factory's folder) in its system prompt and keeps it until DSH stops; job_start names that version (guideline_version).
    # The review page (the "Review" link at the foot of DSH's sidebar) uses DSH's own sign-in: it asks for no token. A job's "Start review talk" writes the
    # talk's folder under ~/.config/zees-factory/review-talks/ and opens it in Orca as a Claude Code session; the talk's one tool is the built
    # lib/dist/proposeServer.js next to this file, and nothing is set up by hand.
    recordsModule: <absolute path of lib/dist/jobLog.js in the factory's folder, for example /home/me/projects/zees-software-factory/lib/dist/jobLog.js>
    # The orca program that opens a review talk. Optional: left out, DSH looks for orca on PATH, then at /opt/homebrew/bin/orca,
    # once when it starts; with none found, "Start review talk" is refused. When set, only this file is used.
    # The repository Accept and "Write trend report" save into: an absolute path to a clone of a throwaway repository with its own
    # remote. Optional: left out, the guideline is read from the factory repository and Accept and "Write trend report" are refused,
    # so nothing is saved. When set, every save goes there, never into the factory repository, and the guideline every session starts
    # with, the review page's versions and the trend report's input are read from its remote's main too, so sessions DSH starts see an
    # accepted version. The factory repository's guideline does not get it until this points at the factory repository, at the move to
    # main; until then a repository that is the factory, or shares a remote address with it, is refused.
    # review:
    #   orca: /opt/homebrew/bin/orca
    #   saveRepo: /home/me/projects/guideline-throwaway
    projects:
      - <absolute path of a project, for example /home/me/projects/factory-testbed>
